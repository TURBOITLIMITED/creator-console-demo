<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Creator Console v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: collapsible icon rail on the left, sticky header, work area = table panel + sticky form panel */
:root{
  --paper:#f7f7f6; --panel:#ffffff; --sunk:#f1f1ef;
  --ink:#141519; --ink-2:#55585f; --ink-3:#8a8d95;
  --rule:#e6e6e3; --rule-2:#efefec;
  --accent:#3346ff; --accent-hi:#2233ee; --accent-ink:#ffffff; --accent-soft:#eceeff; --accent-line:#c9cfff;
  --ok:#11804a; --ok-soft:#e2f3e9; --warn:#9a5c00; --warn-soft:#fbefd9; --bad:#c42f37; --bad-soft:#fbe5e6;
  --shadow:0 1px 2px rgba(20,21,25,.04),0 8px 24px -12px rgba(20,21,25,.12);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; --side-w:244px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111215; --panel:#18191d; --sunk:#141518;
  --ink:#ececef; --ink-2:#a6a9b1; --ink-3:#73767e;
  --rule:#2a2c32; --rule-2:#212328;
  --accent:#6876ff; --accent-hi:#8792ff; --accent-ink:#0b0c10; --accent-soft:#1f2347; --accent-line:#363e86;
  --ok:#4fc58b; --ok-soft:#14301f; --warn:#e3a84d; --warn-soft:#33270f; --bad:#ff6e75; --bad-soft:#3a1a1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111215; --panel:#18191d; --sunk:#141518;
  --ink:#ececef; --ink-2:#a6a9b1; --ink-3:#73767e;
  --rule:#2a2c32; --rule-2:#212328;
  --accent:#6876ff; --accent-hi:#8792ff; --accent-ink:#0b0c10; --accent-soft:#1f2347; --accent-line:#363e86;
  --ok:#4fc58b; --ok-soft:#14301f; --warn:#e3a84d; --warn-soft:#33270f; --bad:#ff6e75; --bad-soft:#3a1a1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%;transition:grid-template-columns .22s ease}
.app[data-collapsed="true"]{--side-w:68px}
.side{position:sticky;top:0;height:100dvh;align-self:start;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border-right:1px solid var(--rule);padding:14px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.mark svg{width:18px;height:18px}
.brand b{font-weight:650;letter-spacing:-.01em;font-size:15px}
.brand small{display:block;font:500 10.5px var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-group{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--ink-3);padding:16px 10px 6px;white-space:nowrap;height:36px}
.nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;white-space:nowrap;position:relative;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a[aria-current="page"] .i{stroke-width:2.1}
.nav .count{margin-left:auto;font:600 11px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.app[data-collapsed="true"] .nav-label,.app[data-collapsed="true"] .brand-text,.app[data-collapsed="true"] .plan-card .pc-body{display:none}
.app[data-collapsed="true"] .nav-group{color:transparent;position:relative}
.app[data-collapsed="true"] .nav-group::after{content:"";position:absolute;left:14px;right:14px;top:22px;height:1px;background:var(--rule)}
.app[data-collapsed="true"] .nav .count{position:absolute;top:4px;right:4px;padding:0 5px;font-size:9.5px}
.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--rule-2)}
.plan-card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r);background:var(--sunk);white-space:nowrap}
.plan-card .pc-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--rule);color:var(--accent);flex:none}
.plan-card b{font-size:12.5px;display:block}
.plan-card span{font:500 11px var(--f-mono);color:var(--ink-3)}
.collapse-btn{display:flex;align-items:center;gap:11px;height:34px;padding:0 10px;border:0;background:none;border-radius:7px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.collapse-btn:hover{background:var(--sunk);color:var(--ink)}
.app[data-collapsed="true"] .collapse-btn .i{transform:scaleX(-1)}

.main{min-width:0;display:flex;flex-direction:column;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:48px}
.demo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink)}
.demo .tag{font:600 10.5px var(--f-mono);letter-spacing:.1em;background:var(--accent);color:var(--accent-ink);padding:3px 7px;border-radius:5px}
.demo p{margin:0;flex:1;min-width:200px;color:var(--ink-2)}
.demo p b{color:var(--ink);font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:14px 0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);margin-bottom:24px}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb small{font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.crumb h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge-admin{font:600 10.5px var(--f-mono);letter-spacing:.1em;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:5px}
.user{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 4px;border-radius:999px;border:1px solid var(--rule);background:var(--panel)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:650;font-size:13px;flex:none}
.user .email{font-size:13px;color:var(--ink-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.menu-btn{display:none}

/* ---------- common ---------- */
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--ink-2);max-width:62ch;flex:1;min-width:220px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.panel-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.panel-head .muted{font-size:12.5px}
.panel-head .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-body{padding:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split > .form-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font-weight:550;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn .i{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-color:var(--accent-ink) transparent var(--accent-ink) transparent;animation:spin .7s linear infinite}
.btn:not(.primary).busy::after{border-color:var(--ink) transparent var(--ink) transparent}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:5px 11px;border-radius:6px;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* table */
.table-wrap{overflow-x:auto;min-height:120px;position:relative}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font:600 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 16px;border-bottom:1px solid var(--rule-2);white-space:nowrap;background:var(--panel)}
td{padding:11px 16px;border-bottom:1px solid var(--rule-2);vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.cell-main{display:flex;align-items:center;gap:12px;min-width:220px}
.cell-main b{font-weight:550;display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.cell-main small{font:12px var(--f-mono);color:var(--ink-3)}
.thumb{width:36px;height:36px;border-radius:7px;display:grid;place-items:center;flex:none;border:1px solid var(--rule)}
.thumb.video{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.thumb.image{background:var(--ok-soft);color:var(--ok)}
.thumb.document{background:var(--warn-soft);color:var(--warn)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.act{height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink-3);cursor:pointer;font-size:12.5px;font-weight:550}
.act:hover{background:var(--panel);border-color:var(--rule);color:var(--ink)}
.act .i{width:15px;height:15px}
.act.danger:hover{color:var(--bad)}
.act.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.price{font-family:var(--f-mono);font-weight:500}
.price small{color:var(--ink-3);font-size:11px;margin-left:3px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;padding:3px 9px 3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--sunk);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.off{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* pager */
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.pager .info{font-size:12.5px;color:var(--ink-3)}
.pager .pages{margin-left:auto;display:flex;gap:4px}
.pager button{min-width:30px;height:30px;border-radius:7px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);cursor:pointer;font:500 12.5px var(--f-mono);display:grid;place-items:center;padding:0 8px}
.pager button:hover:not([disabled]){border-color:var(--ink-3);color:var(--ink)}
.pager button[aria-current="page"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pager button[disabled]{opacity:.4;cursor:default}
.pager .i{width:14px;height:14px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.input,select.input,textarea.input{width:100%;height:38px;padding:0 11px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:110px;padding:10px 11px;resize:vertical;line-height:1.5}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.invalid{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.input-affix{position:relative}
.input-affix .input{padding-right:52px}
.input-affix span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:600 11px var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);padding:3px;border-radius:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg label .i{width:15px;height:15px}
.seg input:checked + label{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:36px;height:20px;border-radius:999px;background:var(--rule);position:relative;transition:background .18s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch small{display:block;color:var(--ink-3);font-size:12px}
.form-actions{display:flex;gap:8px;padding-top:4px}
.form-actions .btn.primary{flex:1}
.form-title{display:flex;align-items:center;gap:8px}
.form-title .pill{margin-left:auto}
.checklist{max-height:210px;overflow:auto;border:1px solid var(--rule);border-radius:8px}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 11px;border-bottom:1px solid var(--rule-2);font-size:13px;cursor:pointer}
.checklist label:last-child{border-bottom:0}
.checklist label:hover{background:var(--sunk)}
.checklist input{accent-color:var(--accent);width:15px;height:15px}
.checklist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist .p{font:12px var(--f-mono);color:var(--ink-3)}
input[type=range]{accent-color:var(--accent);width:100%}

/* spinner / empty */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 16px;color:var(--ink-3);font-size:13px}
.spinner{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--rule);border-top-color:var(--accent);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px}
.empty .e-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.empty .e-ico .i{width:24px;height:24px}
.empty h3{margin:0;font-size:15px;font-weight:600}
.empty p{margin:0 0 8px;color:var(--ink-2);max-width:40ch;text-wrap:balance}
.err{color:var(--bad)}
.err .e-ico{background:var(--bad-soft);color:var(--bad)}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;font-weight:500}
.stat-top .i{width:16px;height:16px;color:var(--ink-3)}
.stat-num{font:600 30px/1.1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-num small{font-size:13px;color:var(--ink-3);letter-spacing:.04em;margin-left:6px;font-weight:500}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .stat-top,.stat.hero .stat-top .i,.stat.hero .stat-num small,.stat.hero .stat-foot{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.stat.hero .trend{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink)}
.trend{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font:600 11.5px var(--f-mono);padding:2px 7px;border-radius:999px}
.trend .i{width:12px;height:12px;stroke-width:2.4}
.trend.up{background:var(--ok-soft);color:var(--ok)}
.trend.down{background:var(--bad-soft);color:var(--bad)}
.trend.flat{background:var(--sunk);color:var(--ink-3)}
.stat-foot{font-size:12px;color:var(--ink-3)}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--rule-2)}
.chart .base{stroke:var(--rule)}
.chart .lbl{fill:var(--ink-3);font:500 10.5px var(--f-mono)}
.chart .bar{fill:var(--accent);opacity:.32;transition:opacity .15s}
.chart .bar.last{opacity:1}
.chart .bar:hover{opacity:.85}
.chart .val{fill:var(--accent);font:600 11px var(--f-mono)}
.chart-sum{display:flex;gap:28px;padding:14px 16px 0;flex-wrap:wrap}
.chart-sum div{display:flex;flex-direction:column}
.chart-sum b{font:600 18px var(--f-mono);letter-spacing:-.02em}
.chart-sum span{font-size:12px;color:var(--ink-3)}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:flex;gap:12px;padding:10px 16px;align-items:flex-start}
.feed li + li{border-top:1px solid var(--rule-2)}
.feed .f-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-2)}
.feed .f-ico .i{width:15px;height:15px}
.feed .f-ico.sale{background:var(--ok-soft);color:var(--ok)}
.feed .f-ico.msg{background:var(--accent-soft);color:var(--accent)}
.feed .f-body{flex:1;min-width:0}
.feed .f-body p{margin:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .f-body p b{font-weight:600}
.feed .f-body span{font-size:12px;color:var(--ink-3)}
.feed .f-amt{font:600 12.5px var(--f-mono);color:var(--ok);white-space:nowrap}
.top-list{list-style:none;margin:0;padding:6px 0}
.top-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px}
.top-list .rank{font:600 11px var(--f-mono);color:var(--ink-3)}
.top-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.top-list .meter{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.top-list .meter i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);min-height:560px}
.conv-list{border-right:1px solid var(--rule-2);display:flex;flex-direction:column;min-width:0}
.conv-list .list{flex:1;min-height:300px}
.conv{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--rule-2);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;position:relative}
.conv:hover{background:var(--sunk)}
.conv[aria-current="true"]{background:var(--accent-soft)}
.conv[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.conv .avatar{width:36px;height:36px;font-size:14px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule)}
.conv .c-body{flex:1;min-width:0}
.conv .c-top{display:flex;gap:8px;align-items:baseline}
.conv .c-top b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .c-top span{margin-left:auto;font:11px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.conv p{margin:2px 0 0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .unread{min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 10.5px/18px var(--f-mono);text-align:center;padding:0 5px;align-self:center}
.inbox-crumbs{font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:22px}
.crumb-back{border:0;background:none;font:inherit;color:var(--accent);cursor:pointer;padding:0}
.crumb-back:hover{text-decoration:underline}
.crumb-sep{color:var(--ink-3)}
/* library girl cards + gallery grid */
.lib-girls{display:grid;gap:10px}
.girl-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;cursor:pointer;width:100%;text-align:left;transition:border-color .15s}
.girl-card:hover{border-color:var(--accent-line)}
.girl-card .avatar{width:40px;height:40px;font-size:15px}
.girl-card .gc-body{flex:1;min-width:0}
.girl-card .gc-top{display:flex;align-items:baseline;gap:8px}
.girl-card .gc-top b{font-size:14px}
.girl-card .gc-top small{color:var(--ink-3)}
.girl-card p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.girl-card .i{color:var(--ink-3)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gal-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gal-card.is-hidden{opacity:.62}
.gal-thumb{height:110px;display:grid;place-items:center;background:var(--sunk);border-bottom:1px solid var(--rule)}
.gal-thumb.image{color:var(--ok)}
.gal-thumb.video{color:var(--accent)}
.gal-thumb.document{color:var(--warn)}
.gal-meta{padding:10px 12px 6px;flex:1;min-width:0}
.gal-meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-meta small{color:var(--ink-3);font-size:11.5px}
.gal-actions{display:flex;gap:4px;padding:8px 10px 10px;border-top:1px solid var(--rule-2)}
.gal-thumb img,.gal-thumb video,.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;background:#000}
.thumb{overflow:hidden}
.gal-thumb{position:relative}
.gal-thumb .badge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font:600 10px/1 var(--f-mono);padding:3px 5px;pointer-events:none}
.gal-lightbox{position:fixed;inset:0;background:rgba(8,9,12,.92);z-index:80;display:grid;place-items:center;padding:24px}
.gal-lightbox .gal-lb-body{max-width:min(1100px,92vw);max-height:82vh;display:grid;place-items:center}
.gal-lightbox img,.gal-lightbox video{max-width:100%;max-height:82vh;border-radius:10px;background:#000}
.gal-lightbox .gal-lb-close{position:absolute;top:16px;right:16px;background:var(--panel)}
.conv.is-unread .c-top b{color:var(--ink)}
.conv.is-unread p{color:var(--ink);font-weight:500}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.thread-head .avatar{width:34px;height:34px}
.thread-head b{display:block;font-weight:600}
.thread-head small{font:12px var(--f-mono);color:var(--ink-3)}
.thread-head .end{margin-left:auto;display:flex;gap:6px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:8px;background:var(--sunk);max-height:520px;min-height:320px}
.day-sep{align-self:center;font:500 11px var(--f-mono);color:var(--ink-3);padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--rule);margin:6px 0}
.bubble{max-width:min(78%,460px);padding:8px 12px 6px;border-radius:12px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.05);overflow-wrap:anywhere}
.bubble.in{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.bubble.out{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble time{display:block;text-align:right;font:10.5px var(--f-mono);opacity:.6;margin-top:2px}
.bubble .ai{font:600 9.5px var(--f-mono);letter-spacing:.08em;opacity:.75;margin-right:6px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--rule-2)}
.composer .input{flex:1}
.thread-empty{flex:1;display:grid;place-items:center}

/* accounts */
.conn{display:flex;align-items:center;gap:8px}
.conn code{font:12px var(--f-mono);color:var(--ink-2);background:var(--sunk);padding:2px 6px;border-radius:5px}
.tg-handle{font-weight:550}
.tg-handle span{color:var(--ink-3);font-weight:400}

/* ai */
.ai-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
.phone{background:var(--sunk);border-radius:0 0 var(--r) var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row output{font:600 12.5px var(--f-mono);min-width:34px;text-align:right}
.tone-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tone-list input{position:absolute;opacity:0;pointer-events:none}
.tone-list label{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tone-list label b{font-size:13px;font-weight:600}
.tone-list label span{font-size:12px;color:var(--ink-3)}
.tone-list input:checked + label{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.tone-list input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.counter{font:11px var(--f-mono);color:var(--ink-3);text-align:right}

/* wallet */
.wallet-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.addr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;background:var(--sunk);border:1px dashed var(--rule);font:500 13px var(--f-mono);overflow-wrap:anywhere}
.addr span{flex:1;min-width:0}
.split-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin:10px 0 8px}
.split-bar i{background:var(--accent)}
.split-bar em{background:var(--ink-3);opacity:.35}
.split-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.split-legend b{font-family:var(--f-mono)}
.earn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-2);border-top:1px solid var(--rule-2)}
.earn div{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.earn span{font-size:12px;color:var(--ink-3)}
.earn b{font:600 17px var(--f-mono);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.earn div.yours b{color:var(--accent)}

/* toasts */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:min(360px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;gap:11px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:var(--r);background:var(--ink);color:var(--panel);box-shadow:0 12px 32px -8px rgba(0,0,0,.35);animation:tin .32s cubic-bezier(.2,.9,.3,1.2) both}
.toast.out{animation:tout .25s ease forwards}
.toast .t-ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.toast .t-ico .i{width:14px;height:14px;stroke-width:2.4}
.toast.success .t-ico{background:var(--ok);color:#fff}
.toast.error .t-ico{background:var(--bad);color:#fff}
.toast.info .t-ico{background:var(--accent);color:#fff}
.toast b{display:block;font-weight:600;font-size:13.5px}
.toast span{font-size:12.5px;opacity:.7}
.toast button{margin-left:auto;background:none;border:0;color:inherit;opacity:.5;cursor:pointer;padding:2px}
.toast button:hover{opacity:1}
@keyframes tin{from{transform:translateX(calc(100% + 24px));opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(calc(100% + 24px));opacity:0}}

.fade-in{animation:fade .28s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.4);z-index:25}

/* page loading overlay: covers stale view during route changes */
.page-loading{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:90}
.page-loading.active{display:flex}

/* responsive */
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.ai-wrap,.wallet-grid,.ov-grid{grid-template-columns:minmax(0,1fr)}
  .split > .form-panel,.preview{position:static}
}
@media (max-width:860px){
  .app,.app[data-collapsed="true"]{grid-template-columns:minmax(0,1fr);--side-w:264px}
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow)}
  .app[data-drawer="open"] .side{transform:none}
  .app .nav-label,.app .brand-text,.app .plan-card .pc-body{display:revert!important}
  .app .nav-group{color:var(--ink-3)!important}.app .nav-group::after{display:none}
  .collapse-btn{display:none}
  .menu-btn{display:grid}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .user .email{display:none}
  .user{padding:2px;border:0;background:none}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .conv-list{border-right:0;border-bottom:1px solid var(--rule-2)}
  .inbox[data-open="true"] .conv-list{display:none}
  .inbox:not([data-open="true"]) .thread{display:none}
  .back-btn{display:grid!important}
}
@media (max-width:520px){
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .stat-num{font-size:24px}
  .row2,.tone-list{grid-template-columns:1fr}
  .earn{grid-template-columns:1fr}
  .crumb h1{font-size:18px}
}
.back-btn{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

/* ---------- toasts ---------- */
function toast(title, type='success', sub=''){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="t-ico">${ic(type==='error'?'alert':type==='info'?'alert':'check')}</div>
    <div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>
    <button type="button" aria-label="Dismiss">${ic('x')}</button>`;
  const kill = () => { el.classList.add('out'); setTimeout(()=>el.remove(), 260); };
  el.querySelector('button').onclick = kill;
  $('#toasts').appendChild(el);
  setTimeout(kill, type==='error' ? 6000 : 3800);
}

/* ---------- Supabase client ---------- */
async function getClient(){
  if(!configured()) return null;
  try{
    const { createClient } = await import(SUPABASE_ESM);
    return createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  }catch(e){ console.error('Supabase failed to load', e); toast('Could not load Supabase', 'error', 'Check your network and the CDN URL.'); return null; }
}

/* ---------- auth ---------- */
async function checkAuth(){
  state.sb = await getClient();
  if(state.sb){
    const { data:{ session } } = await state.sb.auth.getSession();
    if(session){
      state.session = session; state.demo = false;
      const id = session.user.id;
      let { data:creator, error } = await state.sb.from('creators').select('*').eq('id', id).maybeSingle();
      if(error) throw error;
      if(!creator){
        const ins = await state.sb.from('creators').insert({
          id, name:(session.user.email||'creator').split('@')[0]
        }).select().single();
        if(ins.error) throw ins.error;
        creator = ins.data;
        toast('Welcome aboard', 'success', 'Your creator profile has been created.');
      }
      state.creator = creator;
      try{ const { data } = await state.sb.rpc('is_console_admin'); state.isAdmin = !!data; }catch{}
      if(state.isAdmin){ try{ const { data: rows } = await state.sb.from('creators').select('id, name').order('created_at', { ascending:true }); state.aiCreators = rows || []; }catch{} }
      state.sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT') location.href = 'login.html'; });
      return;
    }
  }
  location.replace('login.html');
}

function shapeStats([conv, media, bund], purchases, unread){
  const d30 = Date.now()-30*D, d60 = Date.now()-60*D;
  const sum = arr => arr.reduce((s,p)=>s+Number(p.amount_ton||0),0);
  const t = p => new Date(p.created_at).getTime();
  const days = Array.from({length:14}, (_,i) => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-13+i); return { date:d, total:0, n:0 }; });
  purchases.forEach(p => { const d=new Date(p.created_at); d.setHours(0,0,0,0); const slot=days.find(x=>x.date.getTime()===d.getTime()); if(slot){ slot.total+=Number(p.amount_ton||0); slot.n++; } });
  return {
    conversations:{ total:conv[0], now:conv[1], prev:conv[2] },
    media:{ total:media[0], now:media[1], prev:media[2] },
    bundles:{ total:bund[0], now:bund[1], prev:bund[2] },
    revenue:{ total:sum(purchases), now:sum(purchases.filter(p=>t(p)>=d30)), prev:sum(purchases.filter(p=>t(p)>=d60&&t(p)<d30)), sales:purchases.length },
    days, unread
  };
}
function mergeActivity(msgs, pur, media){
  return [
    ...msgs.map(m => ({ kind:'msg', at:m.created_at, html:`<b>${esc(nameOf(m.customer))}</b> sent “${esc(m.text)}”` })),
    ...pur.map(p => ({ kind:'sale', at:p.created_at, amt:p.amount_ton, html:`<b>${esc(nameOf(p.customers))}</b> bought ${esc(p.content_bundles?.name || 'a bundle')}` })),
    ...media.map(m => ({ kind:'media', type:m.type, at:m.created_at, html:`Added <b>${esc(m.title)}</b> to the library` }))
  ].sort((a,b) => new Date(b.at) - new Date(a.at)).slice(0,8);
}

const typeIcon = t => t==='video'?'video':t==='image'?'image':'document';
function pager(key, page, count){
  const pages = Math.max(1, Math.ceil(count / PAGE_SIZE));
  if(count === 0) return '';
  const from = (page-1)*PAGE_SIZE + 1, to = Math.min(count, page*PAGE_SIZE);
  let nums = [];
  for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-page)<=1) nums.push(p); else if(nums[nums.length-1]!=='…') nums.push('…'); }
  return `<div class="pager"><span class="info">Showing <span class="mono">${from}–${to}</span> of <span class="mono">${fmtNum(count)}</span></span>
    <div class="pages">
      <button type="button" data-act="page" data-key="${key}" data-page="${page-1}" ${page<=1?'disabled':''} aria-label="Previous page">${ic('left')}</button>
      ${nums.map(n => n==='…' ? `<button type="button" disabled>…</button>` : `<button type="button" data-act="page" data-key="${key}" data-page="${n}" ${n===page?'aria-current="page"':''}>${n}</button>`).join('')}
      <button type="button" data-act="page" data-key="${key}" data-page="${page+1}" ${page>=pages?'disabled':''} aria-label="Next page">${ic('right')}</button>
    </div></div>`;
}

const setView = html => { const v = $('#view'); v.innerHTML = html; v.classList.remove('fade-in'); void v.offsetWidth; v.classList.add('fade-in'); $('#pageLoading').classList.remove('active'); };
function trend(now, prev){
  if(!prev && !now) return `<span class="trend flat">—</span>`;
  if(!prev) return `<span class="trend up">${ic('up')}New</span>`;
  const pct = Math.round((now - prev) / prev * 100);
  if(pct === 0) return `<span class="trend flat">0%</span>`;
  return `<span class="trend ${pct>0?'up':'down'}">${ic(pct>0?'up':'down')}${Math.abs(pct)}%</span>`;
}
async function withBusy(btn, fn, okTitle, okSub){
  if(btn){ btn.disabled = true; btn.classList.add('busy'); }
  try{
    const r = await fn();
    return r ?? true;
  }catch(e){
    toast(e.message || 'Something went wrong', e.kind || 'error', e.sub || (e.details || e.hint || ''));
    return false;
  }finally{ if(btn){ btn.disabled = false; btn.classList.remove('busy'); } }
}
/* two-tap delete: first tap arms, second tap within 3s confirms */
function armed(btn){
  if(btn.classList.contains('armed')) return true;
  btn.classList.add('armed'); const old = btn.innerHTML; btn.innerHTML = `${ic('trash')}Confirm`;
  setTimeout(() => { if(btn.isConnected){ btn.classList.remove('armed'); btn.innerHTML = old; } }, 3000);
  return false;
}

      <span></span><div class="meter"><i style="width:${(b.rev/max*100).toFixed(1)}%"></i></div></li>`).join('')}</ul>`

function niceMax(v){ const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10) * p; }
function revenueChart(days){
  const W=640, H=230, pl=46, pr=10, pt=22, pb=30, iw=W-pl-pr, ih=H-pt-pb;
  const max = niceMax(Math.max(...days.map(d=>d.total), 1)), bw = iw / days.length;
  const total = days.reduce((s,d)=>s+d.total,0), sales = days.reduce((s,d)=>s+d.n,0);
  const best = days.reduce((a,b)=>b.total>a.total?b:a, days[0]);
  const y = v => pt + ih - (v/max)*ih;
  let g = '';
  [0,.25,.5,.75,1].forEach(f => { const v=max*f; g += `<line class="${f===0?'base':'grid'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${v%1?v.toFixed(1):v}</text>`; });
  days.forEach((d,i) => {
    const h = Math.max(d.total ? 2 : 0, (d.total/max)*ih), x = pl + i*bw + bw*.18, last = i===days.length-1;
    g += `<rect class="bar ${last?'last':''}" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${d.date.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}: ${fmtTon(d.total)} · ${d.n} sale${d.n===1?'':'s'}</title></rect>`;
    if(i%2===1 || last) g += `<text class="lbl" x="${(x+bw*.32).toFixed(1)}" y="${H-10}" text-anchor="middle">${last?'Today':d.date.getDate()}</text>`;
    if(last && d.total) g += `<text class="val" x="${(x+bw*.32).toFixed(1)}" y="${(pt+ih-h-7).toFixed(1)}" text-anchor="middle">${fmtTon(d.total,false)}</text>`;
  });
  return `<div class="chart-sum"><div><b>${fmtTon(total,false)}</b><span>TON in 14 days</span></div><div><b>${sales}</b><span>sales</span></div><div><b>${fmtTon(sales?total/sales:0,false)}</b><span>avg. order, TON</span></div><div><b>${best.total?best.date.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'}</b><span>best day</span></div></div>
    <div style="padding:6px 8px 4px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of daily revenue in TON over the last 14 days">${g}</svg></div>`;
}

async function renderInbox(){
  setView(`

  state.inbox.active = null;
  loadInboxLevel();

  state.inboxPoll = setInterval(() => {
    if (state.section !== 'inbox') return;
    if (state.inboxCreator) loadCreatorChats(state.inboxCreator.accountId, state.inboxCreator.creatorId);

/* Level 1: the creator list, derived from Telegram accounts (one account = one
   girl = one creator persona). Shows per-creator chat counts when there are
   conversations, and stays honest when there are none yet. */
async function loadInboxLevel(){
  const el = $('#conv-list'); if(!el) return;
  if(state.inboxCreator) return;                 // we are inside a creator: don't wipe it
  try{
    const { rows: accounts } = await Data.list('telegram_accounts', { select:'id, username, first_name, last_name, connected, creator_id', size:50, scopeOwner:true });
    const { rows: convs } = await Data.list('conversations', { select:'id, creator_id, state, last_message_at, business_connections(telegram_account_id)', order:'last_message_at', size:100 });
    // map creator_id -> { chats, lastAt, open }
    const byCreator = new Map();
    for(const c of convs){
      // Per-girl counts: a chat belongs to the girl whose business connection
      // carried it, never to whoever owns the creator row.
      const key = (c.business_connections && c.business_connections.telegram_account_id) || c.creator_id;
      const b = byCreator.get(key) || { chats:0, open:0, lastAt:null };
      b.chats++; if(c.state !== 'closed') b.open++;
      if(!b.lastAt || c.last_message_at > b.lastAt) b.lastAt = c.last_message_at;
      byCreator.set(key, b);
    }
    const rows = accounts.map(a => {
      const stat = byCreator.get(a.id) || { chats:0, open:0, lastAt:null };
      return `<button type="button" class="conv" data-act="inbox-creator" data-id="${esc(a.id)}" data-creator="${esc(a.creator_id)}">
        <div class="avatar">${esc((a.first_name||a.username||'?')[0].toUpperCase())}</div>
        <div class="c-body"><div class="c-top"><b>${esc(a.first_name||a.username||'Account')}</b><span>${stat.lastAt ? ago(stat.lastAt) : ''}</span></div>
          <p>${stat.chats ? `${stat.chats} chat${stat.chats===1?'':'s'}${stat.open ? ` · ${stat.open} open` : ''}` : 'No chats yet'}</p></div>
        ${a.connected ? '' : '<span class="pill draft">Disabled</span>'}
      </button>`;
    }).join('');
    el.innerHTML = accounts.length ? rows
      : empty('inbox','No accounts yet','Connect a Telegram account first; its chats will appear here.', `<a class="btn sm primary" href="#accounts">${ic('plus')}Accounts</a>`);
    $('#conv-pager').innerHTML = '';
    $('#inbox-crumbs').textContent = 'Creators';
  }catch(e){ el.innerHTML = errorState(e,'inbox'); }
}
/* Level 2: chats for one creator (from the account's business connections). */
async function loadCreatorChats(accountId, creatorId){
  const el = $('#conv-list'); if(!el) return;
  el.innerHTML = spinner('Loading chats…');
  try{
    const { data: bcs, error } = await state.sb.from('business_connections').select('id, telegram_account_id').eq('telegram_account_id', accountId);
    if(error) throw error;
    const bcIds = (bcs||[]).map(b => b.id);
    let rows = [];
    if(bcIds.length){
      const { data: convs, error:e2 } = await state.sb.from('conversations').select('*, customers(username, first_name)').in('business_connection_id', bcIds).order('last_message_at',{ascending:false}).limit(100);
      if(e2) throw e2;
      rows = convs || [];
    }
    convCache = rows;
    const name = await creatorName(creatorId, accountId);
    $('#inbox-crumbs').innerHTML = `<button type="button" class="crumb-back" data-act="inbox-back">Creators</button> <span class="crumb-sep">/</span> <b>${esc(name)}</b>`;
    el.innerHTML = rows.length ? rows.map(c => `
      <button type="button" class="conv" data-act="open-conv" data-id="${c.id}" aria-current="${state.inbox.active===c.id}">
        <div class="avatar">${esc(nameOf(c.customers)[0].toUpperCase())}</div>
        <div class="c-body"><div class="c-top"><b>${esc(nameOf(c.customers))}</b><span>${ago(c.last_message_at)}</span></div>
          <p>${c.state==='closed'?'<span class="muted">Closed · </span>':''}${esc(c.summary || c.customer_ref || 'No messages yet')}</p></div>
      </button>`).join('')
      : empty('inbox', 'No chats yet', 'When fans message this account, their chats land here.');
    $('#conv-pager').innerHTML = '';
    $('#inbox').dataset.level = 'chats';
  }catch(e){ el.innerHTML = errorState(e,'inbox'); }
}
/* Show a creator's display name (account first_name beats the creators row). */
async function creatorName(creatorId, accountId){
  if(accountId){
    const { data:a, error } = await state.sb.from('telegram_accounts').select('first_name, username').eq('id', accountId).maybeSingle();
    if(!error && a) return a.first_name || a.username || 'Account';
  }
  if(creatorId){
    const { data:c, error } = await state.sb.from('creators').select('name').eq('id', creatorId).maybeSingle();
    if(!error && c) return c.name || 'Creator';
  }

/* Polling helper: refresh the open thread's messages without rebuilding the list. */
async function refreshThread(id){
  const conv = convCache.find(c => c.id === id); if(!conv) return;
  try{
    const msgs = await Data.messages(id);
    let lastDay = '';
    const box = $('#msgs'); if(!box) return;
    box.innerHTML = msgs.length ? msgs.map(m => {
      const day = new Date(m.sent_at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      const sep = day !== lastDay ? `<span class="day-sep">${day}</span>` : ''; lastDay = day;
      return `${sep}<div class="bubble ${m.direction==='out'?'out':'in'}">${esc(m.body_preview)}<time>${m.sender==='ai'?'<span class="ai">AI</span>':''}${fmtTime(m.sent_at)}</time></div>`;
    }).join('') : box.innerHTML;
    box.scrollTop = box.scrollHeight;
  }catch(e){ /* polling errors are silent; the full openConversation shows them */ }
}
let convCache = [];
/* legacy alias kept so any stray call still works */
async function loadConversations(){
  if(state.inboxCreator) return loadCreatorChats(state.inboxCreator.accountId, state.inboxCreator.creatorId);
  return loadInboxLevel();
}
async function openConversation(id){
  const conv = convCache.find(c => c.id === id); if(!conv) return;

/* Signed URL for a stored file (content-store is private). Null on failure,
   callers fall back to the type icon. */
async function galSignedUrl(key){
  if(!key) return null;
  try{
    const { data, error } = await state.sb.storage.from('content-store').createSignedUrl(key, 3600);
    return (!error && data && data.signedUrl) ? data.signedUrl : null;
  }catch{ return null; }
}
/* Fill a card/thumb element with the real preview (img for photos, muted
   video element for clips). */
function galPreviewInto(el, kind, url){
  if(!el || !url) return;
  if(kind === 'image') el.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy">`;
  else if(kind === 'video') el.innerHTML = `<video src="${esc(url)}" muted preload="metadata" playsinline></video>`;
}
/* Lightbox: click any preview to see it full size. */
function galLightbox(url, kind){
  document.querySelector('.gal-lightbox')?.remove();
  const lb = document.createElement('div');
  lb.className = 'gal-lightbox';
  lb.innerHTML = `<div class="gal-lb-body">${kind === 'video' ? `<video src="${esc(url)}" controls autoplay playsinline></video>` : `<img src="${esc(url)}" alt="">`}</div><button class="icon-btn gal-lb-close" aria-label="Close">${ic('x')}</button>`;
  lb.addEventListener('click', e => { if(e.target === lb || e.target.closest('.gal-lb-close')) lb.remove(); });
  document.body.appendChild(lb);
}

const view = $('#view');
view.addEventListener('click', async e => {
  const a = e.target.closest('[data-act]'); if(!a) return;
  const id = a.dataset.id, act = a.dataset.act;
  switch(act){
    case 'retry': route(true); break;
    case 'focus': $('#'+a.dataset.target)?.focus(); $('#'+a.dataset.target)?.scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'page': {
      const k = a.dataset.key; state.pages[k] = Number(a.dataset.page);
      ({ inbox:loadConversations, library:loadLibrary, bundles:loadBundles })[k]?.();
      break; }
    /* accounts */
    case 'acc-open': openAccount(id); break;
    case 'acc-close': $('#acc-detail').innerHTML = ''; state.accTab = null; break;
    case 'acc-tab': state.accTab = a.dataset.tab; if(state.accOpenId) openAccount(state.accOpenId); break;
    case 'acc-persona-reset':
      if(await withBusy(a, async () => { await Data.deleteAccountPersona(id); }, 'Reset to creator default')) openAccount(id);
      break;
    case 'acc-connect': showConnectWizard(); break;
    case 'wiz-close': $('#connect-wizard')?.remove(); break;
    case 'acc-del': if(armed(a) && await withBusy(a, () => Data.remove('telegram_accounts', id), 'Account removed')) loadAccounts(); break;
    /* inbox */
    case 'inbox-creator': state.inboxCreator = { accountId:id, creatorId:a.dataset.creator }; state.inbox.active = null;
      $('#inbox').dataset.open = 'false'; $('#thread').innerHTML = `<div class="thread-empty">${empty('message','Pick a conversation','Choose a chat on the left to read the thread and reply.')}</div>`;
      loadCreatorChats(id, a.dataset.creator); break;
    case 'inbox-back': state.inboxCreator = null; state.inbox.active = null;
      $('#inbox').dataset.open = 'false'; $('#thread').innerHTML = `<div class="thread-empty">${empty('message','Pick a conversation','Choose a chat on the left to read the thread and reply.')}</div>`;
      loadInboxLevel(); break;
    case 'open-conv': openConversation(id); break;
    case 'close-thread': $('#inbox').dataset.open = 'false'; break;
    case 'conv-status': {
      const conv = convCache.find(c=>c.id===id); const next = conv.state==='closed'?'open':'closed';
      if(await withBusy(a, () => Data.update('conversations', id, { state:next }), next==='closed'?'Conversation closed':'Conversation reopened')){
        conv.state = next;
        if(state.inboxCreator) await loadCreatorChats(state.inboxCreator.accountId, state.inboxCreator.creatorId);
        openConversation(id);
      }
      break; }
    case 'conv-del': if(armed(a) && await withBusy(a, () => Data.remove('conversations', id), 'Conversation deleted')){ state.inbox.active=null;
      if(state.inboxCreator) loadCreatorChats(state.inboxCreator.accountId, state.inboxCreator.creatorId); else renderInbox(); } break;
    /* library */
    case 'lib-type': state.libType = a.dataset.type; state.pages.library = 1;
      a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b===a)); loadLibrary(); break;
    case 'lib-new': $('#lib-form-wrap').innerHTML = libForm(); $('#md-title').focus(); break;
    case 'lib-girl': { $('#lib-detail').innerHTML = ''; state.libOpen = { accountId:id, creatorId:a.dataset.girl }; state.libAccountId = id; openGirlLibrary(id, a.dataset.girl); break; }
    case 'lib-girl-back': $('#lib-detail').innerHTML = ''; state.libGirl = null; state.libOpen = null; state.libAccountId = null; window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'lib-girl-add': { state.libGirl = a.dataset.girl || ownerTarget();
      const host = $('#lib-form-wrap') || (() => { const d = document.createElement('aside'); d.className='panel form-panel'; d.id='lib-form-wrap'; $('#lib-detail').append(d); return d; })();
      host.innerHTML = libForm(); host.scrollIntoView({behavior:'smooth',block:'start'}); $('#md-title').focus(); break; }
    case 'gal-upload': { const w = $('#gal-form-wrap'); w.innerHTML = galUploadForm(); fillGalGirlOptions(); w.scrollIntoView({behavior:'smooth',block:'start'}); $('#md-title').focus(); break; }
    case 'gal-live': if(await withBusy(a, () => Data.update('media_items', id, { visible: a.dataset.on!=='1' }), a.dataset.on==='1'?'Removed from live':'Added to live')) loadGallery(); break;
    case 'gal-edit': { state.libGirl = libCache.find(m=>m.id===id)?.creator_id || state.libGirl;
      const w = $('#gal-form-wrap'); w.innerHTML = libForm(libCache.find(m=>m.id===id)); w.scrollIntoView({behavior:'smooth',block:'start'}); $('#md-title').focus(); break; }
    case 'gal-del': if(armed(a) && await withBusy(a, () => Data.remove('media_items', id), 'Deleted from gallery')){ loadGallery(); $('#gal-form-wrap').innerHTML=''; } break;
    case 'lib-edit': $('#lib-form-wrap').innerHTML = libForm(libCache.find(m=>m.id===id)); $('#md-title').focus(); break;
    case 'lib-toggle': if(await withBusy(a, () => Data.update('media_items', id, { visible: a.dataset.on!=='1' }), a.dataset.on==='1'?'Removed from live':'Item is live')){
      if(state.libOpen) openGirlLibrary(state.libOpen.accountId, state.libOpen.creatorId); else loadLibrary(); } break;
    case 'lib-del': if(armed(a) && await withBusy(a, () => Data.remove('media_items', id), 'Item deleted')){ loadLibrary(); $('#lib-form-wrap').innerHTML = libForm(); } break;
    /* bundles */
    case 'bun-girl-new': { state.libGirl = a.dataset.girl || ownerTarget();
      fillBundleForm(null, state.libGirl).then(()=>{ $('#lib-form-wrap').innerHTML=''; $('#bun-form-wrap')?.scrollIntoView({behavior:'smooth',block:'start'}); $('#bu-name')?.focus(); }); break; }
    case 'bun-new': fillBundleForm().then(()=>$('#bu-name')?.focus()); break;
    case 'bun-edit': fillBundleForm(bunCache.find(b=>b.id===id)).then(()=>$('#bu-name')?.focus()); break;
    case 'bun-toggle': if(await withBusy(a, () => Data.update('content_bundles', id, { active: a.dataset.on!=='1' }), a.dataset.on==='1'?'Bundle deactivated':'Bundle is on sale')) loadLibrary(); break;
    case 'bun-del': if(armed(a) && await withBusy(a, () => Data.remove('content_bundles', id), 'Bundle deleted')){ loadLibrary(); fillBundleForm(); } break;
    /* wallet */
    case 'ln-copy': {
      const { data: c } = await state.sb.from('creators').select('dashboard_token').eq('id', id).single();
      const link = `${location.origin}/creator.html#t=${c.dashboard_token}`;
      try{ await navigator.clipboard.writeText(link); toast('Link copied','success','Paste it into a chat with the creator.'); }
      catch{ prompt('Copy this link:', link); }
      break; }
    case 'ln-new': {
      const tok = 'ct-' + crypto.randomUUID();
      if(await withBusy(a, () => Data.update('creators', id, { dashboard_token: tok }), 'New link created')) renderLinks();
      break; }
    case 'setup-close': $('#setup-steps')?.remove(); break;
    case 'copy-addr': {
      const t = $('#addr-text')?.textContent || '';
      try{ await navigator.clipboard.writeText(t); toast('Address copied','success'); }
      catch{ const r=document.createRange(); r.selectNodeContents($('#addr-text')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Address selected','info','Press ⌘C / Ctrl+C to copy.'); }
      break; }
  }
});

view.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type="submit"]'), kind = f.dataset.form, id = f.dataset.id;
  if(kind === 'account'){
    const token = f.connection.value.trim();
    const t = ownerTarget();
    let me = null;
    const run = async () => {
      if(!/^\d+:[\w-]+$/.test(token)) throw new Error('Enter a valid bot token from @BotFather');
      me = await fetch(`https://api.telegram.org/bot${token}/getMe`).then(r => r.json());
      if(!me.ok) throw new Error('Telegram rejected that token');
      const existing = await state.sb.from('telegram_accounts').select('id').eq('creator_id', t).eq('tg_user_id', me.result.id).maybeSingle();
      if(existing.data){
        return Data.update('telegram_accounts', existing.data.id, { connected:true });
      }
      return Data.saveAccount({ tg_user_id: me.result.id, username: me.result.username, first_name: me.result.first_name, connected:true }, null, t);
    };
    // stash result row for opening the detail after submit
    const saved = await withBusy(btn, run, 'Account connected');
    if(saved){
      f.reset();
      const wiz = $('#wiz-enabled'); if(wiz) wiz.checked = true;
      $('#connect-wizard')?.remove();
      loadAccounts();
      toast('Account connected','success','Opening it now — set her persona.');
      if(saved.id) openAccount(saved.id);
    }
  }
  if(kind === 'media'){
    const data = { title:f.title.value.trim(), kind:f.kind.value, price_ton:f.price_ton.value?Number(f.price_ton.value):null, description:f.description.value.trim()||null, visible:f.visible.checked };
    if(!data.title){ f.title.classList.add('invalid'); return; }
    const file = f.file?.files?.[0];
    const run = async () => {
      let media_key = null;
      if(file){
        const safe = file.name.replace(/[^\w.\-]/g,'_');
        const target = f.girl?.value || f.dataset.girl || state.libGirl || ownerTarget();
        const path = `${target}/${Date.now()}-${safe}`;
        const { error: upErr } = await state.sb.storage.from('content-store').upload(path, file, { contentType: file.type || 'application/octet-stream' });
        if(upErr) throw upErr;
        media_key = path;
      }
      const fields = { ...data, ...(media_key ? { media_key, media_type: file.type || 'application/octet-stream', media_size: file.size } : {}) };
      const t = f.girl?.value || f.dataset.girl || state.libGirl || ownerTarget();
      const acct = state.girlAccounts?.[t] || state.libAccountId || null;
      const payload = id ? fields : { ...fields, creator_id:t, telegram_account_id:acct };
      return id ? Data.update('media_items', id, fields) : state.sb.from('media_items').insert(payload).select().single().then(({data:d, error}) => { if(error) throw error; return d; });
    };
    const inGallery = !!f.girl;
    if(await withBusy(btn, run, id ? 'Changes saved' : 'Uploaded')){
      if(inGallery){ $('#gal-form-wrap').innerHTML = ''; loadGallery(); }
      else {
        if(state.libOpen) openGirlLibrary(state.libOpen.accountId, state.libOpen.creatorId); else loadLibrary();
        $('#lib-form-wrap') && ($('#lib-form-wrap').innerHTML = libForm());
      }
    }
  }
  if(kind === 'bundle'){
    const items = [...f.querySelectorAll('input[name="items"]:checked')].map(i=>i.value);
    if(!items.length){ toast('Pick at least one item','error','A bundle needs something inside it.'); return; }
    const data = { name:f.name.value.trim(), description:f.description.value.trim()||null, price_ton:Number(f.price_ton.value), active:f.active.checked };
    const girl = f.dataset.girl || state.libGirl || ownerTarget();
    if(await withBusy(btn, () => Data.saveBundle(id||null, data, items, girl), id ? 'Bundle updated' : 'Bundle created')){
      if(!id) state.pages.bundles = 1;
      fillBundleForm(); loadLibrary();
    }
  }
  if(kind === 'ai'){
    const data = { display_name:f.persona_name.value.trim()||null, tone:f.tone.value, system_prompt:f.system_prompt.value.trim(),
      first_contact_line:f.first_contact_line?.value.trim()||null, disclose_on_first_contact:f.disclose_on_first_contact?.checked||false, enabled:f.enabled.checked };
    /* Per-account persona panel: the form lives under #acc-personality and saves
       to account_personas for the open account instead of the creator default. */
    const accSlot = f.closest('#acc-personality');
    if(accSlot && state.accOpenId){
      const saved = await withBusy(btn, () => Data.saveAccountPersona(state.accOpenId, {
        ...data, creator_id: ownerTarget(),
      }), 'Account persona saved');
      if(saved) loadAccountPersonaPanel('#acc-personality', { id: state.accOpenId });
      return;
    }
    if(await withBusy(btn, () => Data.saveAI(data, ownerTarget()), 'Personality saved')) renderAI();
  }
  if(kind === 'wallet'){
    const v = f.ton_wallet.value.trim();
    if(!TON_RE.test(v)){ f.ton_wallet.classList.add('invalid'); toast("That isn't a valid TON address", 'error', 'Expect 48 characters starting with UQ or EQ.'); return; }
    if(await withBusy(btn, async () => { await Data.saveAI({ wallet_address:v }); state.creator = { ...state.creator, ton_wallet:v }; }, 'Payout address saved')) renderWallet();
  }
  if(kind === 'reply'){
    const conv = convCache.find(c=>c.id===id), text = f.text.value.trim(); if(!text) return;
    const m = await withBusy(btn, () => Data.sendMessage(conv, text), null);
    if(m){
      f.reset();
      const box = $('#msgs'); box.querySelector('.thread-empty')?.remove();
      box.insertAdjacentHTML('beforeend', `<div class="bubble out fade-in">${esc(text)}<time>${fmtTime(new Date().toISOString())}</time></div>`);
      box.scrollTop = box.scrollHeight;
      const row = document.querySelector(`.conv[data-id="${id}"] p`); if(row) row.textContent = text;
    }
  }
});

/* ---------- Creator Links ---------- */
async function renderLinks(){
  setView(`
    ${secHead('Each creator gets their own private link to add and remove their content. Nothing else. Regenerate a link to invalidate the old one.')}
    <section class="panel"><div class="panel-head"><h2>Creators</h2><span class="end muted" id="ln-count"></span></div>
      <div class="table-wrap" id="ln-table">${spinner('Loading creators…')}</div></section>`);
  const el = $('#ln-table'); if(!el) return;
  try{
    const { data: rows, error } = await state.sb.from('creators').select('id, name, dashboard_token, items_total').order('created_at', { ascending: true });
    if(error) throw error;
    $('#ln-count').textContent = rows.length ? `${rows.length} creator${rows.length===1?'':'s'}` : '';
    el.innerHTML = rows.length ? `<table><thead><tr><th>Creator</th><th>Content link</th><th class="num">Items</th><th class="num">Actions</th></tr></thead><tbody>
      ${rows.map(c => `<tr>
        <td><div class="cell-main"><div class="avatar">${esc((c.name||'?')[0].toUpperCase())}</div><div><b>${esc(c.name||c.id)}</b><small>${esc(c.id)}</small></div></div></td>
        <td>${c.dashboard_token ? `<code style="font:12px var(--f-mono);background:var(--sunk);padding:2px 6px;border-radius:5px">…${esc(c.dashboard_token.slice(-8))}</code>` : '<span class="muted">None yet</span>'}</td>
        <td class="num mono">${fmtNum(c.items_total||0)}</td>
        <td><div class="row-actions">
          ${c.dashboard_token ? `<button class="act" data-act="ln-copy" data-id="${c.id}" title="Copy link">${ic('copy')}Copy link</button>` : ''}
          <button class="act" data-act="ln-new" data-id="${c.id}" title="Regenerate">${ic('refresh')}New link</button>
        </div></td></tr>`).join('')}</tbody></table>`
      : empty('send','No creators yet','Add a creator row first.');
  }catch(e){ el.innerHTML = errorState(e,'links'); }
}

/* ---------- shell: routing, sidebar, header ---------- */
function setUnread(n){ state.unread = n; const b = $('#nav-unread'); b.hidden = !n; b.textContent = n; }
async function route(force=false){
  const sec = (location.hash || '#overview').slice(1);
  const key = SECTIONS[sec] ? sec : 'overview';
  if(!force && key === state.section && $('#view').children.length) return;
  // Show loading overlay on navigation
  $('#pageLoading').classList.add('active');
  state.section = key;
  // kill any live poller from the section we are leaving (interval stacking
  // made the inbox textbox visibly flicker on and off)
  if(state.inboxPoll && key !== 'inbox'){ clearInterval(state.inboxPoll); state.inboxPoll = null; }
  document.querySelectorAll('#nav a').forEach(a => a.dataset.sec === key ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('#crumb-title').textContent = SECTIONS[key].title;
  $('#crumb-group').textContent = SECTIONS[key].group;
  document.title = `${SECTIONS[key].title} · Creator Console`;
  $('#app').dataset.drawer = 'closed'; document.querySelector('.scrim')?.remove();
  await SECTIONS[key].render();
}
function paintHeader(){
  const c = state.creator || {}, email = state.session?.user?.email || c.email || 'demo';
  $('#avatar').textContent = (c.name || email)[0].toUpperCase();
  $('#user-email').textContent = email;
  $('#admin-badge').hidden = !state.isAdmin;
}

$('#collapse').onclick = () => { const app=$('#app'); const v = app.dataset.collapsed !== 'true'; app.dataset.collapsed = v; store.set('cc-collapsed', v); };
$('#menu').onclick = () => {
  const app = $('#app'); app.dataset.drawer = 'open';
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = () => { app.dataset.drawer='closed'; s.remove(); }; document.body.appendChild(s);
};
$('#logout').onclick = async () => {
  if(state.sb && state.session){ await state.sb.auth.signOut(); }
  toast('Signed out', 'info'); setTimeout(() => location.href = 'login.html', 400);
};
window.addEventListener('hashchange', () => route());
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#app').dataset.drawer==='open'){ $('#app').dataset.drawer='closed'; document.querySelector('.scrim')?.remove(); } });

/* ---------- boot ---------- */
(async function boot(){
  if(store.get('cc-collapsed') === 'true') $('#app').dataset.collapsed = 'true';
  $('#view').innerHTML = spinner('Restoring your session…');
  try{ await checkAuth(); }
  catch(e){ console.error(e); toast('Could not load your profile', 'error', e.message); }
  paintHeader();
  route(true);
})();
</script>
