<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Creator Console</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#05060a; --paper:#05060a; --panel:rgba(255,255,255,.04); --sunk:rgba(255,255,255,.03);
  --ink:#f3f5fb; --ink-2:#a6abc0; --ink-3:#6d728a;
  --rule:rgba(255,255,255,.08); --rule-2:rgba(255,255,255,.05);
  --accent:#2b3af7; --accent-hi:#4a58ff; --accent-ink:#ffffff;
  --accent-soft:rgba(43,58,247,.14); --accent-line:rgba(43,58,247,.38);
  --ok:#2fd18b; --ok-soft:rgba(47,209,139,.14);
  --bad:#ff5d73; --bad-soft:rgba(255,93,115,.14);
  --night:#05060a; --night-2:#0b0d16; --star:#f3f5fb; --star-dim:rgba(243,245,251,.55);
  --volt:#2b3af7; --volt-glow:rgba(43,58,247,.45); --gain:#2fd18b;
  --violet:#7c5cff; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 24px 60px -28px rgba(0,0,0,.85);
  --f-ui:ui-sans-serif, Inter, "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:ui-monospace, "Geist Mono", "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);overflow:hidden}

.night{position:relative;overflow:hidden;color:var(--star);isolation:isolate;
  background:radial-gradient(120% 90% at 60% 45%,var(--night-2) 0%,var(--night) 62%);height:100%;min-height:0}
.night::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 18%,var(--star-dim) 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,var(--star-dim) 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 88% 64%,var(--star-dim) 50%,transparent 51%),radial-gradient(1px 1px at 22% 82%,var(--star-dim) 50%,transparent 51%),
  radial-gradient(1px 1px at 46% 8%,var(--star-dim) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 6% 56%,var(--star-dim) 50%,transparent 51%),
  radial-gradient(1px 1px at 64% 92%,var(--star-dim) 50%,transparent 51%),radial-gradient(1px 1px at 94% 34%,var(--star-dim) 50%,transparent 51%)}
.stage{position:absolute;inset:0;cursor:grab;touch-action:pan-y}
.stage:active{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.form-side{height:100%;overflow-y:auto;display:grid;place-items:center;padding-block:40px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.card-f{width:100%;max-width:392px;display:flex;flex-direction:column;gap:20px}
.card-f h2{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:650}
.card-f .sub{margin:4px 0 0;color:var(--ink-2)}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.input{width:100%;height:44px;padding:0 13px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{height:44px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-ui);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,box-shadow .2s;text-decoration:none}
.btn:hover{background:var(--accent-hi);box-shadow:0 8px 24px -10px var(--accent)}
.btn[disabled]{opacity:.7;cursor:not-allowed}
.btn.busy{color:transparent}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-ink);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--rule);font-weight:550}
.btn.ghost:hover{border-color:var(--ink-3);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font:500 13px var(--f-ui);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
.note{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.45;display:flex;gap:10px}
.note.info{background:var(--accent-soft);border:1px solid var(--accent-line)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note code{font:12px var(--f-mono);background:var(--panel);padding:1px 5px;border-radius:4px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:900px){
  .wrap{display:block;position:relative}
  .night{position:absolute;inset:0;height:100%}
  .stage{touch-action:none}
  .form-side{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
    padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px calc(14px + env(safe-area-inset-bottom,0px))}
  .card-f{pointer-events:auto;max-width:420px;gap:14px;padding:20px 18px;border-radius:18px;
    background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    border:1px solid color-mix(in srgb,var(--rule) 70%,transparent);box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
  .card-f h2{font-size:22px}
  .input,.btn{height:42px}
}
@media (max-width:900px) and (max-height:740px){ .card-f .sub{display:none} }
@media (max-width:900px) and (max-height:620px){ .card-f a.link{display:none} .card-f{gap:10px;padding:16px} }
/* phone: 16px fields stop iOS zooming the whole page on focus */
@media (max-width:900px){
  .input{font-size:16px;height:46px}
  .btn{height:46px}
  .input,.btn{min-height:46px}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="night" aria-hidden="true">
    <div class="stage" id="stage"><canvas id="globe"></canvas></div>
  </aside>

  <main class="form-side">
    <div class="card-f">
      <div><h2 id="heading">Welcome back</h2><p class="sub" id="subheading">Sign in with the email linked to your creator account.</p></div>
      <div id="msg" class="note" hidden></div>
      <form id="form" novalidate>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@studio.com"></div>
        <div class="field" id="pass-field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters"></div>
        <button class="btn" type="submit" id="submit">Sign in</button>
        <div class="row" id="pass-row"><button type="button" class="link" id="forgot">Forgot password?</button></div>
      </form>
    </div>
  </main>
</div>

const SUPABASE_ESM = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const $ = s => document.querySelector(s);
const nextParam = new URLSearchParams(location.search).get('next');
const NEXT = ['index.html','admin.html'].includes(nextParam) ? nextParam : 'index.html';
const consoleUrl = new URL(NEXT, location.href).href;
if(NEXT === 'admin.html') $('#subheading').textContent = 'Admin sign-in. Your account needs console admin access.';
let sb = null;

function say(text, kind='err'){ const m=$('#msg'); m.className=`note ${kind}`; m.textContent=text; m.hidden=false; }
function busy(on){ const b=$('#submit'); b.disabled=on; b.classList.toggle('busy',on); }
function setMode(){
  $('#msg').hidden = true;
  $('#submit').textContent = 'Sign in';
  $('#password').autocomplete = 'current-password';
}
setMode();

async function init(){
  try{
    const { createClient } = await import(SUPABASE_ESM);
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    const { data:{ session } } = await sb.auth.getSession();
    if(session) location.replace(consoleUrl);
    sb.auth.onAuthStateChange((ev, s) => { if(s && ev==='SIGNED_IN') location.replace(consoleUrl); });
  }catch(e){ say('Could not load Supabase. Check your connection and try again.'); }
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault(); $('#msg').hidden = true;
  const email = $('#email').value.trim(), password = $('#password').value;
  if(!/^\S+@\S+\.\S+$/.test(email)){ say('Enter a valid email address.'); $('#email').focus(); return; }
  if(password.length < 8){ say('Passwords are at least 8 characters.'); $('#password').focus(); return; }
  if(!sb){ say('Supabase is still loading — try again in a second.', 'info'); return; }
  busy(true);
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    // TOTP step: a password-only session (aal1) cannot open the console now that
    // the API checks admin properly and requires aal2.
    const lvl = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(lvl?.data?.nextLevel === 'aal2' && lvl?.data?.currentLevel !== 'aal2'){
      const { data:fl } = await sb.auth.mfa.listFactors();
      const f = (fl?.totp || []).find(x => x.status === 'verified');
      if(f){
        for(let i=0;i<3;i++){
          const code = prompt('Enter your 6 digit authenticator code');
          if(!code) throw new Error('Authenticator check cancelled.');
          const ch = await sb.auth.mfa.challenge({ factorId: f.id });
          if(ch.error) throw ch.error;
          const vr = await sb.auth.mfa.verify({ factorId: f.id, challengeId: ch.data.id, code: code.trim() });
          if(!vr.error) break;
          say('That code was not accepted. Try the next one.');
          if(i === 2) throw new Error('Authenticator check failed.');
        }
      }
    }
    location.replace(consoleUrl);
  }catch(err){
    say(/invalid login/i.test(err.message) ? 'That email and password don\'t match. Try again or reset below.' : err.message);
  }finally{ busy(false); }
});
$('#forgot').onclick = async () => {
  const email = $('#email').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){ say('Enter your email first, then tap "Forgot password?".', 'info'); $('#email').focus(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:consoleUrl });
  error ? say(error.message) : say(`Reset link sent to ${email}.`, 'ok');
};
init();
</script>
